{% load static %}

<header class="cabecalho">
    <img src="{% static 'assets/logo/logo 1.jpg' %}" style="max-width: 64px;  max-height: 64px;  width: auto;  height: auto;  object-fit: contain;" alt="Logo da Alura Space" />
    {% for message in messages %}
    <div class="alert alert-{{message.tags}}" role="alert">
        <p id="messages">{{ message }}</p>
    </div>
    {% endfor %}
    
    <div class="cabecalho__busca">
        <div class="busca__fundo">
            <form action="#">
                <input class="busca__input" type="text" name="buscar" placeholder="O que você procura?">
                <button type="submit" style="background-color: transparent;">
                    <img class="busca__icone" src="{% static 'assets/ícones/1x/search.png' %}" alt="ícone de search" >
                </button>
            </form>
        </div>
    </div>
   
</header>
